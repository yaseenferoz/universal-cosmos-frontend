
name: Deploy Universal Cosmos Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --run

      - name: Build frontend
        run: npm run build
        env:
          VITE_DATA_SOURCE: local

      # Temporary diagnostic: shows identity claims only,
      # never the OIDC token or AWS credentials.
      - name: Diagnose GitHub OIDC claims
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          separator = "&" if "?" in url else "?"
          request = urllib.request.Request(
              url + separator + "audience=sts.amazonaws.com",
              headers={"Authorization": f"Bearer {token}"}
          )

          with urllib.request.urlopen(request) as response:
              jwt = json.load(response)["value"]

          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in [
              "iss",
              "aud",
              "sub",
              "repository",
              "ref",
              "event_name",
              "job_workflow_ref"
          ]:
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::831926610457:role/UniversalCosmosFrontendDeploy
          aws-region: ap-south-1

      - name: Upload frontend to S3
        run: |
          aws s3 sync dist/ s3://universal-cosmos-web-engine/ \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E294OHDBEEQ0XC \
            --paths "/*"
